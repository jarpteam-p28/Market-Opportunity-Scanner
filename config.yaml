# Narrative meters (Camillo's attention trade): count phrases in Reddit posts + headlines vs their own baseline.
narratives:
  ai_fear:
    label: "AI fear / FUD"
    phrases: ["ai bubble", "capex", "circular financing", "open source model", "open-weight", "deepseek", "kimi", "margin call",
              "dot com", "dotcom", "overvalued", "bubble", "ai winter", "depreciation", "openai losses", "data center glut"]
  ai_efficiency:
    label: "AI efficiency evidence"
    phrases: ["ai saved", "saved us", "cut costs", "reduced costs", "lower costs", "headcount", "laid off", "layoffs",
              "replaced by ai", "customer service costs", "productivity gains", "automated", "ai agents replaced"]
  leverage:
    label: "Leverage / forced selling"
    phrases: ["margin call", "liquidation", "leveraged etf", "forced selling", "deleveraging", "korea margin"]

# Event catalysts (Camillo-style scenario trades). Dates: verify before relying on them.
catalysts:
  - name: "GTA 6 launch"
    date: "2026-11-19"            # reported launch date; verify, delays are a key risk
    primary: [TTWO]
    second_order_up: [DASH, UBER, SONY, MSFT]
    second_order_down: [NFLX]
    benchmarks: "Street year-1 units ~30-50M; online spend per monthly user ~$20-60; GTA 5 online still ~$0.6B/yr"

# ---------- 4. Where people talk ----------
reddit:
  subreddits: [stocks, investing, wallstreetbets, StockMarket, options, SecurityAnalysis, energy, nuclear]
  ground_truth_subreddits: [ExperiencedDevs, sysadmin, devops, cscareerquestions, MachineLearning, LocalLLaMA, ITManagers, dataengineering]
  posts_per_sub: 100          # hot + new
  min_ticker_mentions: 3
  rising_min_mentions: 5      # a ticker must have at least this many mentions now to count as 'rising'

google_trends:
  enabled: true
  timeframe: "today 3-m"
  geo: "US"

x_grok:                       # optional, needs XAI_API_KEY secret (paid, ~$5 per 1,000 posts fetched)
  enabled: false
  model: grok-4
  max_queries: 6

news_rss:
  - https://feeds.content.dowjones.io/public/rss/mw_topstories
  - https://www.cnbc.com/id/100003114/device/rss/rss.html
  - https://finance.yahoo.com/news/rssindex
  - https://www.investing.com/rss/news_25.rss

# ---------- 5. Agents (thesis writers) ----------
agents:
  enabled: true               # runs only if ANTHROPIC_API_KEY secret exists; otherwise the data report still ships
  model: claude-sonnet-5-5
  max_tokens: 3000
  order: [regime, sectors, sentiment, themes, skeptic, synthesizer]
