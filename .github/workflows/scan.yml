name: market-scan
on:
  schedule:
    - cron: '35 21 * * 1-5'   # weekdays ~5:35pm New York: collect data (builds the talk baseline)
    - cron: '50 13 * * 6'     # Saturday ~9:50am New York: full weekly report + agents
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full report + agents now'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: { group: market-scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            python scanner/run_all.py
          elif [ "${{ github.event.schedule }}" = "50 13 * * 6" ]; then
            python scanner/run_all.py
          else
            python scanner/run_all.py --collect-only
          fi
      - name: Save results to the repo
        run: |
          git config user.name "scanner-bot"; git config user.email "scanner-bot@users.noreply.github.com"
          git add data reports journal || true
          git diff --cached --quiet || (git commit -m "scan $(date -u +%F)" && git pull --rebase && git push)
